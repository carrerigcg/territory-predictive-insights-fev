# ==============================================================
# Configuracao do Territory Predictive Insights (Clima Local)
# Lida UMA vez pelo Singleton servico.ConfiguracaoSistema
# ==============================================================

# Banco H2 em ARQUIVO (pasta ./dados): o historico sobrevive ao reiniciar o programa.
banco.url=jdbc:h2:./dados/territorio
banco.usuario=sa
banco.senha=

# Estrategias de previsao ativas (criadas pela FabricaPrevisao, na ordem abaixo)
# Valores aceitos: MEDIA_MOVEL, COMPARACAO
previsao.estrategias=MEDIA_MOVEL,COMPARACAO
# Quantas leituras formam a "janela" de cada estrategia
previsao.janela=5
# Abaixo deste numero de leituras no banco o sistema se cala (nao preve, nao alerta)
previsao.minimoLeituras=5

# Codigo de acesso exigido para alterar limiares (DadosTerritorio)
territorio.codigoAcesso=DEFESA2026

# Limiares por tipo de sensor: ATENCAO < ALERTA < CRITICO
# Chuva (mm/h) - referencia: chuva forte >= 25 mm/h, muito forte >= 50 mm/h
limiar.PLUVIOMETRO.ATENCAO=10
limiar.PLUVIOMETRO.ALERTA=25
limiar.PLUVIOMETRO.CRITICO=50
# Nivel do corrego (cm acima do leito) - transbordamento estimado em 350 cm
limiar.NIVEL_CORREGO.ATENCAO=150
limiar.NIVEL_CORREGO.ALERTA=250
limiar.NIVEL_CORREGO.CRITICO=350
# Umidade do solo (%) - solo saturado nao absorve mais agua (enxurrada / deslizamento)
limiar.UMIDADE_SOLO.ATENCAO=70
limiar.UMIDADE_SOLO.ALERTA=85
limiar.UMIDADE_SOLO.CRITICO=95
